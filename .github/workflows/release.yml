name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install root tooling
        run: npm ci

      - name: Install interface dependencies
        working-directory: ui
        run: npm ci

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-windows.txt
          pip install "pyinstaller>=6.6,<7"

      - name: Build backend sidecar
        run: >
          pyinstaller --noconfirm --clean --onefile --name veyra-backend
          --paths . --collect-submodules uvicorn
          --distpath dist-backend --workpath build/pyinstaller --specpath build
          backend/main.py

      - name: Build interface
        working-directory: ui
        run: npm run build

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii checksums.txt
          }
          Get-Content checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
          generate_release_notes: true
          draft: true
