name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  OLLAMA_VERSION: v0.40.16
  OLLAMA_WINDOWS_SHA256: 50fcf5ad54277f2fa5d173ebfc93bcb017adbc0c9ef2314daabc96ca9e6aa64e

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bundle portable Ollama
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $zip = Join-Path $env:RUNNER_TEMP "ollama-windows-amd64.zip"
          $target = Join-Path $PWD "src-tauri/ollama"
          $url = "https://github.com/ollama/ollama/releases/download/$env:OLLAMA_VERSION/ollama-windows-amd64.zip"
          curl.exe --fail --location --retry 3 --output $zip $url
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:OLLAMA_WINDOWS_SHA256) {
            throw "Ollama checksum mismatch: expected $env:OLLAMA_WINDOWS_SHA256, got $hash"
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Expand-Archive -Path $zip -DestinationPath $target -Force
          $exe = Get-ChildItem $target -Recurse -Filter ollama.exe | Select-Object -First 1
          if (-not $exe) { throw "ollama.exe is missing from the portable archive" }
          if ($exe.DirectoryName -ne (Resolve-Path $target).Path) {
            Get-ChildItem $exe.DirectoryName -Force | Move-Item -Destination $target -Force
          }
          if (-not (Test-Path (Join-Path $target "lib/ollama"))) {
            throw "Ollama runtime libraries are missing from the portable archive"
          }
          curl.exe --fail --location --retry 3 --output (Join-Path $target "LICENSE") "https://raw.githubusercontent.com/ollama/ollama/$env:OLLAMA_VERSION/LICENSE"
          Get-ChildItem $target | Select-Object Name, Length

      - name: Install root tooling
        run: npm ci

      - name: Install interface dependencies
        working-directory: ui
        run: npm ci

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-windows.txt
          pip install "pyinstaller>=6.6,<7"

      - name: Build backend sidecar
        run: >
          pyinstaller --noconfirm --clean --onefile --name veyra-backend
          --paths . --collect-submodules uvicorn
          --distpath dist-backend --workpath build/pyinstaller --specpath build
          backend/main.py

      - name: Build interface
        working-directory: ui
        run: npm run build

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii checksums.txt
          }
          Get-Content checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
          generate_release_notes: true
          draft: true
