[package]
name = "veyra"
version = "0.2.0"
description = "Local-first, proactive AI assistant for Windows"
authors = ["Jaskirat"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
